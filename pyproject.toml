[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocgenff"
dynamic = ["version"]
description = "Independent CHARMM CGenFF-inspired small-molecule parameter diagnostics"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
authors = [
  { name = "Haohao Fu", email = "fhh2626@gmail.com" },
]
dependencies = ["rdkit>=2023.9", "numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/fhh2626/AutoCGENFF"
Repository = "https://github.com/fhh2626/AutoCGENFF"
Issues = "https://github.com/fhh2626/AutoCGENFF/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build"]

[project.scripts]
autocgenff = "autocgenff.cli:main"

[tool.setuptools.cmdclass]
sdist = "_build_commands.CleanSdist"

[tool.setuptools.dynamic]
version = {attr = "autocgenff._version.__version__"}

[tool.setuptools.package-data]
"autocgenff.v5" = ["*.rules"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["force_fields"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
